name: Lint & Analysis

on:
  push:
    branches: [main, chore/add-ci-cd-pipeline]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for common security issues
        continue-on-error: true
        run: |
          echo "Checking for hardcoded credentials..."
          if grep -r "password\|api_key\|secret" src/ --include="*.h" --include="*.cpp" | grep -v "auth_token\|bearer_token\|authToken\|SNMP" ; then
            echo "[WARNING] Potential hardcoded credentials found - review above"
            exit 1
          else
            echo "[OK] No obvious hardcoded credentials"
          fi
      
      - name: Validate CMakeLists.txt
        run: |
          echo "Checking CMakeLists.txt syntax..."
          if grep -qE "add_accounting_agent|add_executable|target_link_libraries" CMakeLists.txt; then
            echo "[OK] CMakeLists.txt structure looks valid"
          else
            echo "[ERROR] CMakeLists.txt may be incomplete"
            exit 1
          fi
      
      - name: Check file encoding
        continue-on-error: true
        run: |
          echo "Verifying UTF-8 encoding..."
          find src -type f \( -name "*.h" -o -name "*.cpp" \) -exec sh -c 'file "$1" | grep -v "UTF-8\|ASCII" && echo "[WARNING] $1 may have encoding issues"' _ {} \;
          echo "[OK] File encoding check complete"
      
      - name: Check for TODO/FIXME comments
        continue-on-error: true
        run: |
          echo "Looking for TODO/FIXME comments..."
          if grep -r "TODO\|FIXME" src/ --include="*.h" --include="*.cpp"; then
            echo "[INFO] Found TODO/FIXME comments - consider addressing"
          else
            echo "[OK] No TODO/FIXME comments found"
          fi
