name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          path: agent

      # The core is expected next to the agent (../accounting-agent-core).
      # Pin a release tag with `ref:` once the core has one.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/accounting-agent-core
          path: accounting-agent-core

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure and build (Release)
        shell: cmd
        working-directory: agent
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G Ninja -S . -B cmake-build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer_agent
          path: |
            agent/cmake-build-release/printer_agent.exe
            agent/cmake-build-release/printer_setup.exe
            agent/cmake-build-release/agent.ini
            agent/cmake-build-release/install_service.bat
            agent/cmake-build-release/uninstall_service.bat
            agent/cmake-build-release/check_service.bat
          retention-days: 30

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            agent/cmake-build-release/printer_setup.exe
            agent/cmake-build-release/printer_agent.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
